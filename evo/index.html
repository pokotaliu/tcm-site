<main>

<style>
/* 演化圖頁專用（頁面級·不動 style.css）。顏色一律走既有 CSS 變數，深淺模式同源。*/
.evo-wrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 1rem; margin-top: .9rem; }
.evo-side { border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
            padding: .45rem .5rem; align-self: start; max-height: min(76vh, 740px); overflow: auto; }
.evo-side > summary { cursor: pointer; font-weight: 600; font-size: .9rem; padding: .15rem .3rem;
                      list-style: none; color: var(--ink); }
.evo-side > summary::-webkit-details-marker { display: none; }
.evo-side > summary::before { content: "▾ "; color: var(--muted); }
.evo-side:not([open]) > summary::before { content: "▸ "; }
.evo-list { margin-top: .35rem; display: flex; flex-direction: column; }
.evo-item { display: flex; justify-content: space-between; align-items: baseline; gap: .45rem;
            width: 100%; text-align: left; padding: .26rem .45rem; border: 0; border-radius: 6px;
            background: none; color: var(--ink2); font: inherit; font-size: .85rem; line-height: 1.35;
            cursor: pointer; }
.evo-item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.evo-item .n { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .78rem; }
.evo-item:hover { background: var(--badge-bg); color: var(--ink); }
.evo-item.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.evo-item.on .n { color: var(--accent); }

.evo-bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem; margin-bottom: .4rem; }
.evo-title { font-weight: 600; }
.evo-zoom { margin-left: auto; display: flex; gap: .3rem; }
.evo-btn { padding: .12rem .55rem; border: 1px solid var(--line); border-radius: 6px;
           background: var(--surface); color: var(--ink2); font: inherit; font-size: .85rem; cursor: pointer; }
.evo-btn:hover { border-color: var(--accent); color: var(--accent); }

.evo-stage { position: relative; height: min(72vh, 700px); border: 1px solid var(--line);
             border-radius: 10px; background: var(--surface); overflow: hidden; }
.evo-stage svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none;
                 user-select: none; -webkit-user-select: none; }
.evo-stage svg.drag { cursor: grabbing; }
.evo-hint { position: absolute; left: .6rem; bottom: .35rem; margin: 0; pointer-events: none;
            color: var(--muted); font-size: .75rem; }

/* 邊：級＝線寬／線型，向＝箭頭（marker 走 CSS，hover 換高亮箭頭） */
.evo-stage .ln { fill: none; stroke: var(--ink2); stroke-width: 1.5; marker-end: url(#evar-tb); }
.evo-stage .lv-abs .ln { stroke: var(--accent); stroke-width: 3; marker-end: url(#evar-abs); }
.evo-stage .lv-un .ln { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4;
                        marker-end: url(#evar-un); }
.evo-stage .bi .ln { marker-start: url(#evar-tb); }
.evo-stage .lv-abs.bi .ln { marker-start: url(#evar-abs); }
.evo-stage .lv-un.bi .ln { marker-start: url(#evar-un); }
.evo-stage .hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.evo-stage .ed:hover .ln, .evo-stage .ed.near .ln, .evo-stage .ed.on .ln {
  stroke: var(--miss); stroke-width: 3; marker-end: url(#evar-on); }
.evo-stage .ed:hover.bi .ln, .evo-stage .ed.near.bi .ln, .evo-stage .ed.on.bi .ln {
  marker-start: url(#evar-on); }
.evo-stage .mk path { fill: var(--ink2); }
.evo-stage .mk-abs path { fill: var(--accent); }
.evo-stage .mk-un path { fill: var(--muted); }
.evo-stage .mk-on path { fill: var(--miss); }

/* 節點：實框＝有小卡、虛框＝無小卡 */
.evo-stage .nd rect { fill: var(--surface); stroke: var(--accent); stroke-width: 1.4; }
.evo-stage .nd text { fill: var(--ink); font-size: 13px; text-anchor: middle;
                      font-family: inherit; pointer-events: none; }
.evo-stage .nd.nocard rect { stroke: var(--muted); stroke-dasharray: 4 3; fill: var(--bg); }
.evo-stage .nd.nocard text { fill: var(--muted); }
.evo-stage .nd:hover rect { fill: var(--accent-weak); stroke: var(--accent); }
.evo-stage .nd:hover text { fill: var(--accent); }

/* 詳情欄：桌機浮在圖右下、窄螢幕貼底整寬 */
.evo-detail { position: absolute; right: .6rem; bottom: .6rem; width: min(340px, calc(100% - 1.2rem));
              max-height: 62%; overflow: auto; padding: .6rem .8rem .7rem; background: var(--surface);
              border: 1px solid var(--line); border-radius: 10px;
              box-shadow: 0 4px 18px rgba(0, 0, 0, .16); font-size: .88rem; }
.evo-detail[hidden] { display: none; }
.evo-x { position: absolute; top: .2rem; right: .35rem; border: 0; background: none; cursor: pointer;
         color: var(--muted); font-size: 1.1rem; line-height: 1; padding: .1rem .25rem; }
.evo-x:hover { color: var(--ink); }
.evo-pair { margin: .1rem 1.2rem .35rem 0; font-weight: 600; }
.evo-dir { color: var(--accent); padding: 0 .45em; }
.evo-tags { margin: .2rem 0 .45rem; display: flex; flex-wrap: wrap; gap: .35rem; align-items: baseline; }
.evo-bian { margin: 0; color: var(--ink2); line-height: 1.55; }

.evo-legend { display: flex; flex-wrap: wrap; gap: .35rem 1.1rem; margin: .5rem 0 0;
              color: var(--muted); font-size: .78rem; align-items: center; }
.evo-legend i { display: inline-block; width: 26px; vertical-align: middle; margin-right: .3rem;
                border-top: 1.5px solid var(--ink2); }
.evo-legend i.abs { border-top: 3px solid var(--accent); }
.evo-legend i.un { border-top: 1.5px dashed var(--muted); }
.evo-legend b { display: inline-block; width: 18px; height: 11px; margin-right: .3rem;
                vertical-align: middle; border: 1.4px solid var(--accent); border-radius: 3px; }
.evo-legend b.nocard { border: 1.4px dashed var(--muted); }

@media (max-width: 820px) {
  .evo-wrap { grid-template-columns: 1fr; }
  .evo-side { max-height: 46vh; }
  .evo-stage { height: 66vh; }
  .evo-detail { right: .4rem; left: .4rem; width: auto; max-height: 55%; }
}
</style>

<h1>證型演化圖</h1>
<p class="crumb">鄰居邊（身分＝鄰居）的演變關係：左→右＝演變去向，線粗細＝級，點線看分辨關鍵，點證型進小卡。</p>
<div class="tiles" id="evometa"></div>
<p class="muted" id="evostat">資料載入中…</p>

<div class="evo-wrap">
  <details class="evo-side" id="evoside" open>
    <summary>分量清單 <span class="muted" id="evocount"></span></summary>
    <div class="evo-list" id="evolist"></div>
  </details>

  <div class="evo-main">
    <div class="evo-bar">
      <span class="evo-title" id="evotitle"></span>
      <span class="evo-zoom">
        <button type="button" class="evo-btn" id="evoout" title="縮小">−</button>
        <button type="button" class="evo-btn" id="evoin" title="放大">＋</button>
        <button type="button" class="evo-btn" id="evofit" title="整張圖塞進畫面">適配</button>
      </span>
    </div>
    <div class="evo-stage" id="evostage">
      <svg id="evosvg" role="img" aria-label="證型演化關係圖"></svg>
      <p class="evo-hint">拖曳平移・滾輪縮放</p>
      <div class="evo-detail" id="evodetail" hidden>
        <button type="button" class="evo-x" id="evoclose" title="關閉" aria-label="關閉">×</button>
        <div id="evodbody"></div>
      </div>
    </div>
    <p class="evo-legend">
      <span><i class="abs"></i>絕對級</span>
      <span><i></i>教科書級</span>
      <span><i class="un"></i>未標級</span>
      <span>→ 單向演變</span>
      <span>⇄ 雙向互轉</span>
      <span><b></b>有小卡</span>
      <span><b class="nocard"></b>無小卡（僅 db 條目）</span>
    </p>
  </div>
</div>

<script src="/tcm-site/static/evo.js"></script>
<script>TCMEvo.boot();</script>

</main>
